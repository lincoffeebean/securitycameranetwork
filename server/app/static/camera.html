<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Mode</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #101418;
      }

      main {
        width: min(94vw, 760px);
        margin: 0 auto;
        padding: 20px 0 32px;
      }

      a {
        color: #5ec4ff;
        text-decoration: none;
      }

      h1 {
        margin: 22px 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
      }

      label {
        display: grid;
        gap: 8px;
        color: #c7d1dc;
        font-weight: 700;
      }

      input,
      select,
      button {
        width: 100%;
        min-height: 52px;
        border-radius: 8px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid #34404d;
        background: #151c23;
        color: #f5f7fa;
        padding: 0 14px;
      }

      input[type="range"] {
        padding: 0;
      }

      .controls {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      .quality-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      button {
        margin-top: 14px;
        border: 0;
        background: #5ec4ff;
        color: #071018;
        cursor: pointer;
        font-weight: 800;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 24px;
        margin: 16px 0;
        color: #c7d1dc;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #06090c;
        object-fit: contain;
      }

      canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Back</a>
      <h1>Camera Mode</h1>

      <label for="cameraId">
        Camera ID
        <input id="cameraId" type="text" value="phone-camera" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>

      <div class="controls">
        <label for="fpsSelect">
          FPS
          <select id="fpsSelect">
            <option value="5">5 FPS</option>
            <option value="10">10 FPS</option>
            <option value="15">15 FPS</option>
            <option value="30">30 FPS</option>
          </select>
        </label>

        <label for="qualityRange">
          <span class="quality-heading">
            <span>JPEG Quality</span>
            <span id="qualityValue">0.65</span>
          </span>
          <input id="qualityRange" type="range" min="0.45" max="0.95" step="0.05" value="0.65">
        </label>

        <label for="resolutionSelect">
          Resolution
          <select id="resolutionSelect">
            <option value="720">720p</option>
            <option value="1080">1080p</option>
          </select>
        </label>
      </div>

      <button id="startButton" type="button">Start Camera</button>
      <p id="status">Idle</p>

      <video id="preview" autoplay muted playsinline></video>
      <canvas id="captureCanvas"></canvas>
    </main>

    <script>
      const cameraIdInput = document.getElementById("cameraId");
      const fpsSelect = document.getElementById("fpsSelect");
      const qualityRange = document.getElementById("qualityRange");
      const qualityValue = document.getElementById("qualityValue");
      const resolutionSelect = document.getElementById("resolutionSelect");
      const startButton = document.getElementById("startButton");
      const statusText = document.getElementById("status");
      const preview = document.getElementById("preview");
      const captureCanvas = document.getElementById("captureCanvas");
      const captureContext = captureCanvas.getContext("2d");

      let socket = null;
      let captureTimer = null;

      function setStatus(message) {
        statusText.textContent = message;
      }

      function websocketUrl(cameraId) {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${window.location.host}/ws/camera/${encodeURIComponent(cameraId)}`;
      }

      function selectedFps() {
        return Number.parseInt(fpsSelect.value, 10);
      }

      function selectedQuality() {
        return Number.parseFloat(qualityRange.value);
      }

      function selectedResolution() {
        return resolutionSelect.value === "1080"
          ? { width: 1920, height: 1080 }
          : { width: 1280, height: 720 };
      }

      function updateQualityValue() {
        qualityValue.textContent = selectedQuality().toFixed(2);
      }

      async function zoomAllTheWayOut(stream) {
        const [track] = stream.getVideoTracks();

        if (!track || !track.getCapabilities || !track.applyConstraints) {
          return;
        }

        const capabilities = track.getCapabilities();
        if (!capabilities.zoom || typeof capabilities.zoom.min !== "number") {
          return;
        }

        try {
          await track.applyConstraints({
            advanced: [{ zoom: capabilities.zoom.min }]
          });
        } catch (error) {
          console.warn("Minimum zoom is not supported by this camera.", error);
        }
      }

      function sendFrame() {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          return;
        }

        if (!preview.videoWidth || !preview.videoHeight) {
          return;
        }

        if (socket.bufferedAmount > 4 * 1024 * 1024) {
          return;
        }

        captureCanvas.width = preview.videoWidth;
        captureCanvas.height = preview.videoHeight;
        captureContext.drawImage(preview, 0, 0, captureCanvas.width, captureCanvas.height);

        const frame = captureCanvas.toDataURL("image/jpeg", selectedQuality());
        socket.send(JSON.stringify({
          frame,
          timestamp: new Date().toISOString()
        }));
      }

      async function startCamera() {
        const cameraId = cameraIdInput.value.trim() || "phone-camera";
        cameraIdInput.value = cameraId;
        startButton.disabled = true;
        setStatus("Requesting camera permission...");

        try {
          const fps = selectedFps();
          const resolution = selectedResolution();

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera access is not available in this browser context. Use HTTPS, localhost, or a browser that supports getUserMedia.");
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: resolution.width },
              height: { ideal: resolution.height },
              frameRate: { ideal: fps }
            },
            audio: false
          });

          await zoomAllTheWayOut(stream);
          preview.srcObject = stream;
          setStatus("Connecting...");

          socket = new WebSocket(websocketUrl(cameraId));

          socket.addEventListener("open", () => {
            setStatus(`Streaming as ${cameraId} at ${fps} FPS`);
            clearInterval(captureTimer);
            captureTimer = setInterval(sendFrame, Math.round(1000 / fps));
          });

          socket.addEventListener("close", () => {
            clearInterval(captureTimer);
            captureTimer = null;
            setStatus("Disconnected");
            startButton.disabled = false;
          });

          socket.addEventListener("error", () => {
            setStatus("Connection error");
          });
        } catch (error) {
          setStatus(`Camera failed: ${error.message}`);
          startButton.disabled = false;
        }
      }

      qualityRange.addEventListener("input", updateQualityValue);
      updateQualityValue();
      startButton.addEventListener("click", startCamera);
    </script>
  </body>
</html>
