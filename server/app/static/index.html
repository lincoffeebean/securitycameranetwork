<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security Camera Network</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101418;
      }

      main {
        width: min(92vw, 520px);
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1.05;
      }

      .actions {
        display: grid;
        gap: 16px;
      }

      .panel {
        margin-top: 18px;
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #151c23;
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: #c7d1dc;
        font-size: 0.95rem;
        font-weight: 700;
      }

      input,
      button {
        width: 100%;
        min-height: 46px;
        border-radius: 8px;
        font: inherit;
      }

      input {
        border: 1px solid #34404d;
        background: #10161d;
        color: #f5f7fa;
        padding: 0 14px;
      }

      button {
        border: 0;
        background: #5ec4ff;
        color: #071018;
        font-weight: 800;
        cursor: pointer;
      }

      .status {
        min-height: 20px;
        margin: 10px 0 0;
        color: #c7d1dc;
      }

      a {
        display: flex;
        min-height: 96px;
        align-items: center;
        justify-content: center;
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #1b232c;
        color: #f5f7fa;
        font-size: 1.35rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus,
      a:hover {
        border-color: #5ec4ff;
        background: #223140;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Security Camera Network</h1>
      <nav class="actions" aria-label="Mode selection">
        <a href="/viewer">View Mode</a>
        <a href="/recordings-browser">Recordings</a>
        <a href="/camera">Camera Mode</a>
      </nav>

      <section class="panel" aria-label="TopTek DVR settings">
        <h2>TopTek DVR Password</h2>
        <div class="field">
          <label for="hikvisionPassword">HIKVISION_DVR_PASSWORD</label>
          <input id="hikvisionPassword" type="password" autocomplete="current-password" placeholder="Enter DVR password">
          <button id="savePassword" type="button">Save Password</button>
          <p id="passwordStatus" class="status">Loading settings...</p>
        </div>
      </section>
    </main>

    <script>
      const passwordInput = document.getElementById("hikvisionPassword");
      const savePasswordButton = document.getElementById("savePassword");
      const passwordStatus = document.getElementById("passwordStatus");

      function setStatus(message) {
        passwordStatus.textContent = message;
      }

      async function loadSettings() {
        try {
          const response = await fetch("/api/rtsp-settings");
          const payload = await response.json();
          setStatus(
            payload.has_local_config
              ? "Password is configured on this server."
              : "Password is not configured yet."
          );
        } catch (error) {
          setStatus(`Could not load settings: ${error.message}`);
        }
      }

      savePasswordButton.addEventListener("click", async () => {
        const hikvision_dvr_password = passwordInput.value.trim();
        if (!hikvision_dvr_password) {
          setStatus("Enter a password first.");
          return;
        }

        savePasswordButton.disabled = true;
        setStatus("Saving password...");

        try {
          const response = await fetch("/api/rtsp-settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ hikvision_dvr_password })
          });
          const payload = await response.json();
          if (!payload.ok) {
            throw new Error(payload.error || "Save failed.");
          }

          passwordInput.value = "";
          setStatus("Password saved. RTSP cameras reloaded.");
        } catch (error) {
          setStatus(`Save failed: ${error.message}`);
        } finally {
          savePasswordButton.disabled = false;
        }
      });

      loadSettings();
    </script>
  </body>
</html>
