<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Mode</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #101418;
      }

      main {
        width: min(95vw, 1400px);
        margin: 0 auto;
        padding: 20px 0 36px;
      }

      a {
        color: #5ec4ff;
        text-decoration: none;
      }

      h1 {
        margin: 22px 0 10px;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
      }

      p,
      .timestamp,
      .meta,
      .event-time,
      .event-copy {
        color: #c7d1dc;
      }

      .topline {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      .panel {
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #151c23;
        padding: 16px;
      }

      #status {
        min-height: 24px;
        margin: 0;
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .camera-card {
        overflow: hidden;
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #151c23;
      }

      .frame-shell {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #06090c;
        overflow: hidden;
      }

      .frame-visual {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(var(--rotation, 0deg)) scale(var(--digital-zoom, 1));
        transform-origin: center center;
      }

      .camera-card img,
      .overlay-canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .overlay-canvas {
        pointer-events: none;
      }

      .camera-body {
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      .camera-title {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .camera-id {
        overflow-wrap: anywhere;
        font-size: 1.05rem;
        font-weight: 800;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 4px 9px;
        background: #2d7f55;
        color: #f5f7fa;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .badge.disconnected {
        background: #7b3a37;
      }

      .badge.reconnecting {
        background: #8a6929;
      }

      .badge.recording {
        background: #b1453f;
      }

      .badge.manual {
        background: #4a6188;
      }

      .badge.profile-badge {
        background: #5a6b2e;
      }

      .badge.profile-badge.active {
        background: #b36a22;
      }

      .badge.source-badge {
        background: #2b3a48;
      }

      .badge.source-badge.rtsp {
        background: #4a6188;
      }

      .camera-meta {
        display: grid;
        gap: 4px;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      .controls.is-collapsed {
        display: none;
      }

      .camera-card.is-rtsp .browser-only,
      .camera-card.is-rtsp [data-action="disconnect"] {
        display: none;
      }

      .controls-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 44px;
        padding: 0 14px;
      }

      .controls-toggle .arrow {
        flex: 0 0 auto;
        font-size: 1rem;
        line-height: 1;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #c7d1dc;
        font-size: 0.92rem;
        font-weight: 700;
      }

      input,
      select,
      button {
        width: 100%;
        min-height: 44px;
        border-radius: 8px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid #34404d;
        background: #10161d;
        color: #f5f7fa;
        padding: 0 12px;
      }

      button {
        border: 0;
        background: #5ec4ff;
        color: #071018;
        cursor: pointer;
        font-weight: 800;
      }

      button.secondary {
        background: #2b3a48;
        color: #f5f7fa;
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .overlay-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #10161d;
        color: #f5f7fa;
      }

      .toggle input {
        width: auto;
        min-height: auto;
        margin: 0;
      }

      #events {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .event {
        border: 1px solid #34404d;
        border-radius: 8px;
        background: #151c23;
        padding: 12px 14px;
      }

      .event a {
        color: #8cd0ff;
      }

      @media (max-width: 720px) {
        .control-grid,
        .button-row,
        .overlay-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Back</a>
      <h1>View Mode</h1>

      <div class="topline panel">
        <p id="status">Connecting...</p>
        <p id="detectorStatus">Body detector status: checking</p>
      </div>

      <section id="grid" aria-live="polite"></section>
      <section id="events" aria-live="polite"></section>
    </main>

    <template id="cameraCardTemplate">
      <article class="camera-card">
        <div class="frame-shell" style="--rotation: 0deg; --digital-zoom: 1;">
          <img class="frame-visual" alt="">
          <canvas class="overlay-canvas frame-visual"></canvas>
        </div>
        <div class="camera-body">
          <div class="camera-title">
            <div class="camera-id"></div>
            <div class="badges">
              <span class="badge connection-badge">Live</span>
              <span class="badge source-badge">Web</span>
              <span class="badge mode-badge">Auto</span>
              <span class="badge profile-badge">Idle</span>
            </div>
          </div>

          <div class="camera-meta">
            <div class="timestamp">Waiting for frame</div>
            <div class="meta state-line">State: pending</div>
          </div>

          <button type="button" class="secondary controls-toggle" data-action="toggle-controls" aria-expanded="false">
            <span>Camera Settings</span>
            <span class="arrow">▼</span>
          </button>

          <div class="controls is-collapsed">
            <div class="control-grid">
              <label>
                Camera Name
                <input data-field="display_name" type="text" autocomplete="off">
              </label>

              <label>
                Control Mode
                <select data-field="control_mode">
                  <option value="automatic">Automatic</option>
                  <option value="manual">Manual</option>
                </select>
              </label>

              <label class="browser-only">
                Manual Profile
                <select data-field="manual_profile">
                  <option value="idle">Idle</option>
                  <option value="active">Active</option>
                </select>
              </label>

              <label class="browser-only">
                Idle Resolution
                <select data-field="idle_resolution">
                  <option value="1280x720">720p</option>
                  <option value="1920x1080">1080p</option>
                </select>
              </label>

              <label class="browser-only">
                Idle FPS
                <input data-field="idle_fps" type="number" min="1" max="30" step="1">
              </label>

              <label class="browser-only">
                Idle JPEG
                <input data-field="idle_quality" type="number" min="0.3" max="0.95" step="0.05">
              </label>

              <label class="browser-only">
                Idle Zoom
                <input data-field="idle_zoom" type="number" min="0.5" max="8" step="0.1">
              </label>

              <label class="browser-only">
                Active Resolution
                <select data-field="active_resolution">
                  <option value="1280x720">720p</option>
                  <option value="1920x1080">1080p</option>
                </select>
              </label>

              <label class="browser-only">
                Active FPS
                <input data-field="active_fps" type="number" min="1" max="60" step="1">
              </label>

              <label class="browser-only">
                Active JPEG
                <input data-field="active_quality" type="number" min="0.3" max="0.95" step="0.05">
              </label>

              <label class="browser-only">
                Active Zoom
                <input data-field="active_zoom" type="number" min="0.5" max="8" step="0.1">
              </label>

              <label>
                Clip Seconds
                <input data-field="recording_duration_seconds" type="number" min="5" max="60" step="1">
              </label>

              <label>
                Cooldown
                <input data-field="cooldown_seconds" type="number" min="3" max="120" step="1">
              </label>

              <label>
                Detection Streak
                <input data-field="detection_streak_threshold" type="number" min="1" max="5" step="1">
              </label>
            </div>

            <div class="button-row">
              <button type="button" data-action="apply">Apply Settings</button>
              <button type="button" class="secondary" data-action="record">Record 10s Now</button>
              <button type="button" class="secondary" data-action="rename">Save Name</button>
              <button type="button" class="secondary" data-action="disconnect">Disconnect Camera</button>
            </div>

            <div class="overlay-grid">
              <label class="toggle">
                <input data-overlay="enabled" type="checkbox" checked>
                <span>Pose Overlay</span>
              </label>
              <button type="button" class="secondary" data-action="rotate">Rotate 90 deg</button>
              <label class="toggle">
                <input data-overlay="skeleton" type="checkbox" checked>
                <span>Skeleton</span>
              </label>
              <label class="toggle">
                <input data-overlay="keypoints" type="checkbox" checked>
                <span>Keypoints</span>
              </label>
              <label class="toggle">
                <input data-overlay="labels" type="checkbox">
                <span>Labels</span>
              </label>
              <label>
                Viewer Zoom
                <input data-display="digital_zoom" type="number" min="1" max="4" step="0.25" value="1">
              </label>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script>
      const statusText = document.getElementById("status");
      const detectorStatus = document.getElementById("detectorStatus");
      const grid = document.getElementById("grid");
      const events = document.getElementById("events");
      const template = document.getElementById("cameraCardTemplate");

      const cameras = new Map();
      const adjacentKeyPoints = [
        ["left_shoulder", "right_shoulder"],
        ["left_shoulder", "left_elbow"],
        ["left_elbow", "left_wrist"],
        ["right_shoulder", "right_elbow"],
        ["right_elbow", "right_wrist"],
        ["left_shoulder", "left_hip"],
        ["right_shoulder", "right_hip"],
        ["left_hip", "right_hip"],
        ["left_hip", "left_knee"],
        ["left_knee", "left_ankle"],
        ["right_hip", "right_knee"],
        ["right_knee", "right_ankle"]
      ];

      let socket = null;
      let pingTimer = null;
      let reconnectTimer = null;
      let poseDetector = null;
      let poseDetectorReady = false;

      async function initializePoseDetector() {
        try {
          if (!window.tf || !window.poseDetection) {
            detectorStatus.textContent = "Body detector status: overlay model unavailable";
            return;
          }

          await tf.setBackend("webgl");
          await tf.ready();
          poseDetector = await poseDetection.createDetector(
            poseDetection.SupportedModels.MoveNet,
            {
              modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
              enableSmoothing: true
            }
          );
          poseDetectorReady = true;
          detectorStatus.textContent = "Body detector status: ready with pose overlay";
        } catch (error) {
          detectorStatus.textContent = `Body detector status: overlay unavailable (${error.message})`;
        }
      }

      function websocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${window.location.host}/ws/viewer`;
      }

      function defaultConfig() {
        return {
          control_mode: "automatic",
          manual_profile: "idle",
          idle: { width: 1280, height: 720, fps: 3, quality: 0.6, zoom: 0.5 },
          active: { width: 1920, height: 1080, fps: 30, quality: 0.85, zoom: 0.5 },
          recording_duration_seconds: 10,
          cooldown_seconds: 12,
          detection_enabled: true,
          detection_streak_threshold: 3
        };
      }

      function setResolution(select, width, height) {
        const value = `${width}x${height}`;
        if ([...select.options].some((option) => option.value === value)) {
          select.value = value;
        }
      }

      function parseResolution(value) {
        const [width, height] = value.split("x").map((item) => Number.parseInt(item, 10));
        return { width, height };
      }

      function formatTimestamp(value) {
        if (!value) {
          return "Waiting for frame";
        }

        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
      }

      function ensureCamera(cameraId) {
        if (cameras.has(cameraId)) {
          return cameras.get(cameraId);
        }

        const fragment = template.content.cloneNode(true);
        const card = fragment.querySelector(".camera-card");
        const frameShell = fragment.querySelector(".frame-shell");
        const image = fragment.querySelector("img");
        const overlayCanvas = fragment.querySelector(".overlay-canvas");
        const id = fragment.querySelector(".camera-id");
        const connectionBadge = fragment.querySelector(".connection-badge");
        const sourceBadge = fragment.querySelector(".source-badge");
        const modeBadge = fragment.querySelector(".mode-badge");
        const profileBadge = fragment.querySelector(".profile-badge");
        const timestamp = fragment.querySelector(".timestamp");
        const stateLine = fragment.querySelector(".state-line");
        const controls = fragment.querySelector(".controls");
        const controlsToggle = fragment.querySelector('[data-action="toggle-controls"]');
        const form = {
          displayName: fragment.querySelector('[data-field="display_name"]'),
          controlMode: fragment.querySelector('[data-field="control_mode"]'),
          manualProfile: fragment.querySelector('[data-field="manual_profile"]'),
          idleResolution: fragment.querySelector('[data-field="idle_resolution"]'),
          idleFps: fragment.querySelector('[data-field="idle_fps"]'),
          idleQuality: fragment.querySelector('[data-field="idle_quality"]'),
          idleZoom: fragment.querySelector('[data-field="idle_zoom"]'),
          activeResolution: fragment.querySelector('[data-field="active_resolution"]'),
          activeFps: fragment.querySelector('[data-field="active_fps"]'),
          activeQuality: fragment.querySelector('[data-field="active_quality"]'),
          activeZoom: fragment.querySelector('[data-field="active_zoom"]'),
          recordingDuration: fragment.querySelector('[data-field="recording_duration_seconds"]'),
          cooldownSeconds: fragment.querySelector('[data-field="cooldown_seconds"]'),
          detectionStreakThreshold: fragment.querySelector('[data-field="detection_streak_threshold"]'),
          digitalZoom: fragment.querySelector('[data-display="digital_zoom"]')
        };
        const overlay = {
          enabled: fragment.querySelector('[data-overlay="enabled"]'),
          skeleton: fragment.querySelector('[data-overlay="skeleton"]'),
          keypoints: fragment.querySelector('[data-overlay="keypoints"]'),
          labels: fragment.querySelector('[data-overlay="labels"]')
        };

        id.textContent = cameraId;
        image.alt = `${cameraId} live frame`;

        const camera = {
          cameraId,
          card,
          frameShell,
          image,
          overlayCanvas,
          connectionBadge,
          sourceBadge,
          modeBadge,
          profileBadge,
          timestamp,
          stateLine,
          controls,
          controlsToggle,
          form,
          overlay,
          config: defaultConfig(),
          rotation: 0,
          digitalZoom: 1,
          poseBusy: false,
          state: {
            connected: false,
            current_profile: "idle",
            recording: false,
            source: "browser",
            rtsp_status: null,
            rtsp_reconnect_count: 0,
            rtsp_error: null,
            status: "pending",
            last_clip_path: null,
            last_clip_at: null
          }
        };

        card.dataset.cameraId = cameraId;
        card.querySelector('[data-action="apply"]').addEventListener("click", () => {
          applyCameraConfig(cameraId);
        });
        card.querySelector('[data-action="record"]').addEventListener("click", () => {
          triggerRecording(cameraId);
        });
        card.querySelector('[data-action="rename"]').addEventListener("click", () => {
          saveCameraName(cameraId);
        });
        card.querySelector('[data-action="disconnect"]').addEventListener("click", () => {
          disconnectCamera(cameraId);
        });
        controlsToggle.addEventListener("click", () => {
          toggleCameraControls(cameraId);
        });
        card.querySelector('[data-action="rotate"]').addEventListener("click", () => {
          rotateCamera(cameraId);
        });
        form.controlMode.addEventListener("change", () => {
          syncManualVisibility(camera);
        });
        form.digitalZoom.addEventListener("input", (event) => {
          updateDigitalZoom(cameraId, event.target.value);
        });
        image.addEventListener("load", () => {
          schedulePoseRender(camera);
        });
        for (const input of Object.values(overlay)) {
          input.addEventListener("change", () => {
            schedulePoseRender(camera, true);
          });
        }

        grid.append(fragment);
        cameras.set(cameraId, camera);
        writeConfigToForm(camera);
        syncManualVisibility(camera);
        renderCamera(camera);
        return camera;
      }

      function syncManualVisibility(camera) {
        const manual = camera.form.controlMode.value === "manual";
        camera.modeBadge.textContent = manual ? "Manual" : "Auto";
        camera.modeBadge.classList.toggle("manual", manual);
      }

      function writeConfigToForm(camera) {
        const { config, form } = camera;
        form.displayName.value = camera.state.display_name || camera.cameraId;
        form.controlMode.value = config.control_mode;
        form.manualProfile.value = config.manual_profile;
        setResolution(form.idleResolution, config.idle.width, config.idle.height);
        form.idleFps.value = config.idle.fps;
        form.idleQuality.value = Number(config.idle.quality).toFixed(2);
        form.idleZoom.value = Number(config.idle.zoom || 0.5).toFixed(1);
        setResolution(form.activeResolution, config.active.width, config.active.height);
        form.activeFps.value = config.active.fps;
        form.activeQuality.value = Number(config.active.quality).toFixed(2);
        form.activeZoom.value = Number(config.active.zoom || 0.5).toFixed(1);
        form.recordingDuration.value = config.recording_duration_seconds;
        form.cooldownSeconds.value = config.cooldown_seconds;
        form.detectionStreakThreshold.value = config.detection_streak_threshold || 3;
      }

      function readConfigFromForm(camera) {
        const idleResolution = parseResolution(camera.form.idleResolution.value);
        const activeResolution = parseResolution(camera.form.activeResolution.value);

        return {
          control_mode: camera.form.controlMode.value,
          manual_profile: camera.form.manualProfile.value,
          idle: {
            width: idleResolution.width,
            height: idleResolution.height,
            fps: Number.parseInt(camera.form.idleFps.value, 10),
            quality: Number.parseFloat(camera.form.idleQuality.value),
            zoom: Number.parseFloat(camera.form.idleZoom.value)
          },
          active: {
            width: activeResolution.width,
            height: activeResolution.height,
            fps: Number.parseInt(camera.form.activeFps.value, 10),
            quality: Number.parseFloat(camera.form.activeQuality.value),
            zoom: Number.parseFloat(camera.form.activeZoom.value)
          },
          recording_duration_seconds: Number.parseInt(camera.form.recordingDuration.value, 10),
          cooldown_seconds: Number.parseInt(camera.form.cooldownSeconds.value, 10),
          detection_enabled: camera.form.controlMode.value === "automatic",
          detection_streak_threshold: Number.parseInt(camera.form.detectionStreakThreshold.value, 10)
        };
      }

      function cameraSource(camera) {
        return camera.state.source === "rtsp" ? "rtsp" : "browser";
      }

      function formatRtspStatus(status) {
        if (status === "online") {
          return "Online";
        }
        if (status === "reconnecting" || status === "connecting") {
          return "Reconnecting";
        }
        if (status === "error") {
          return "Error";
        }
        return "Offline";
      }

      function renderCamera(camera) {
        const source = cameraSource(camera);
        const isRtsp = source === "rtsp";
        const rtspStatus = camera.state.rtsp_status || camera.state.status || "offline";
        const rtspError = camera.state.rtsp_error ? ` | ${camera.state.rtsp_error}` : "";
        const reconnects = Number(camera.state.rtsp_reconnect_count || 0);

        camera.timestamp.textContent = formatTimestamp(camera.state.last_frame_at);
        camera.stateLine.textContent = isRtsp
          ? `State: ${formatRtspStatus(rtspStatus)} | Reconnects: ${reconnects}${rtspError}`
          : `State: ${camera.state.status} | Profile: ${camera.state.current_profile}`;
        camera.connectionBadge.textContent = camera.state.recording
          ? "Recording"
          : isRtsp
            ? formatRtspStatus(rtspStatus)
            : (camera.state.connected ? "Live" : "Disconnected");
        camera.connectionBadge.classList.toggle("recording", camera.state.recording);
        camera.connectionBadge.classList.toggle(
          "disconnected",
          isRtsp ? ["offline", "error"].includes(rtspStatus) : !camera.state.connected
        );
        camera.connectionBadge.classList.toggle(
          "reconnecting",
          isRtsp && ["connecting", "reconnecting"].includes(rtspStatus)
        );
        camera.sourceBadge.textContent = isRtsp ? "RTSP" : "WEB";
        camera.sourceBadge.classList.toggle("rtsp", isRtsp);
        camera.profileBadge.textContent = camera.state.current_profile === "active" ? "Active" : "Idle";
        camera.profileBadge.classList.toggle("active", camera.state.current_profile === "active");
        camera.card.classList.toggle("is-rtsp", isRtsp);
        camera.card.querySelector(".camera-id").textContent = camera.state.display_name || camera.cameraId;
        camera.frameShell.style.setProperty("--rotation", `${camera.rotation}deg`);
        camera.frameShell.style.setProperty("--digital-zoom", `${camera.digitalZoom}`);
        camera.controlsToggle.setAttribute("aria-expanded", String(!camera.controls.classList.contains("is-collapsed")));
        camera.controlsToggle.querySelector(".arrow").textContent = camera.controls.classList.contains("is-collapsed") ? "▼" : "▲";
        syncManualVisibility(camera);
      }

      function clearOverlay(camera) {
        const context = camera.overlayCanvas.getContext("2d");
        context.clearRect(0, 0, camera.overlayCanvas.width, camera.overlayCanvas.height);
      }

      function drawPose(camera, poses) {
        const canvas = camera.overlayCanvas;
        const context = canvas.getContext("2d");
        const sourceWidth = camera.image.naturalWidth || camera.image.width;
        const sourceHeight = camera.image.naturalHeight || camera.image.height;
        const displayWidth = camera.image.clientWidth || camera.frameShell.clientWidth;
        const displayHeight = camera.image.clientHeight || camera.frameShell.clientHeight;

        if (!sourceWidth || !sourceHeight || !displayWidth || !displayHeight) {
          return;
        }

        canvas.width = displayWidth;
        canvas.height = displayHeight;
        context.clearRect(0, 0, displayWidth, displayHeight);

        if (!camera.overlay.enabled.checked || poses.length === 0) {
          return;
        }

        const scale = Math.min(displayWidth / sourceWidth, displayHeight / sourceHeight);
        const drawnWidth = sourceWidth * scale;
        const drawnHeight = sourceHeight * scale;
        const offsetX = (displayWidth - drawnWidth) / 2;
        const offsetY = (displayHeight - drawnHeight) / 2;

        function mapPoint(keypoint) {
          return {
            x: offsetX + (keypoint.x * scale),
            y: offsetY + (keypoint.y * scale)
          };
        }

        context.lineWidth = 4;
        context.strokeStyle = "#5ec4ff";
        context.fillStyle = "#ffd166";
        context.font = "16px Arial";

        for (const pose of poses) {
          const pointsByName = new Map();
          for (const keypoint of pose.keypoints || []) {
            if ((keypoint.score || 0) < 0.25) {
              continue;
            }
            pointsByName.set(keypoint.name, keypoint);
          }

          if (camera.overlay.skeleton.checked) {
            for (const [fromName, toName] of adjacentKeyPoints) {
              const from = pointsByName.get(fromName);
              const to = pointsByName.get(toName);
              if (!from || !to) {
                continue;
              }
              const mappedFrom = mapPoint(from);
              const mappedTo = mapPoint(to);
              context.beginPath();
              context.moveTo(mappedFrom.x, mappedFrom.y);
              context.lineTo(mappedTo.x, mappedTo.y);
              context.stroke();
            }
          }

          if (camera.overlay.keypoints.checked) {
            for (const keypoint of pointsByName.values()) {
              const mapped = mapPoint(keypoint);
              context.beginPath();
              context.arc(mapped.x, mapped.y, 5, 0, Math.PI * 2);
              context.fill();
              if (camera.overlay.labels.checked) {
                context.fillText(keypoint.name, mapped.x + 8, mapped.y - 8);
              }
            }
          }
        }
      }

      async function schedulePoseRender(camera, immediate = false) {
        if (!poseDetectorReady || !poseDetector || camera.poseBusy) {
          if (immediate && !camera.overlay.enabled.checked) {
            clearOverlay(camera);
          }
          return;
        }

        if (!camera.overlay.enabled.checked) {
          clearOverlay(camera);
          return;
        }

        camera.poseBusy = true;
        const run = async () => {
          try {
            const poses = await poseDetector.estimatePoses(camera.image, {
              flipHorizontal: false
            });
            drawPose(camera, poses);
          } catch (error) {
            clearOverlay(camera);
          } finally {
            camera.poseBusy = false;
          }
        };

        if (immediate) {
          await run();
          return;
        }

        requestAnimationFrame(() => {
          run();
        });
      }

      function updateFrame(message) {
        const camera = ensureCamera(message.camera_id);
        camera.image.src = message.frame;
        camera.state.last_frame_at = message.timestamp;
        camera.state.current_profile = message.profile || camera.state.current_profile;
        camera.state.source = message.source || camera.state.source;
        renderCamera(camera);
      }

      function updateCameraConfig(cameraId, config) {
        const camera = ensureCamera(cameraId);
        camera.config = config;
        writeConfigToForm(camera);
        renderCamera(camera);
      }

      function updateCameraState(cameraId, nextState) {
        const camera = ensureCamera(cameraId);
        camera.state = { ...camera.state, ...nextState };
        if (camera.form.displayName !== document.activeElement) {
          camera.form.displayName.value = camera.state.display_name || camera.cameraId;
        }
        renderCamera(camera);
      }

      function updateCameraStatus(message) {
        updateCameraState(message.camera_id, {
          connected: message.status === "connected",
          recording: false,
          status: message.status
        });
      }

      function prependEvent(content) {
        const event = document.createElement("article");
        event.className = "event";
        event.innerHTML = content;
        events.prepend(event);

        while (events.childElementCount > 12) {
          events.removeChild(events.lastElementChild);
        }
      }

      function renderEvent(message) {
        if (message.type === "detection_event") {
          const streak = message.detection_hits ? ` after ${message.detection_hits} confirmations` : "";
          prependEvent(`
            <div class="event-copy"><strong>${message.camera_id}</strong> detected a human${streak}.</div>
            <div class="event-time">${formatTimestamp(message.timestamp)}</div>
          `);
        }

        if (message.type === "recording_failed") {
          prependEvent(`
            <div class="event-copy"><strong>${message.camera_id}</strong> failed to record: ${message.message}</div>
            <div class="event-time">${formatTimestamp(message.timestamp)}</div>
          `);
        }
      }

      function applySnapshot(message) {
        const serverStatus = message.detector_available
          ? "server detection ready"
          : "server detection unavailable until OpenCV is installed";
        const overlayStatus = poseDetectorReady
          ? "pose overlay ready"
          : "pose overlay loading or unavailable";
        detectorStatus.textContent = `Body detector status: ${serverStatus}; ${overlayStatus}`;

        for (const item of message.configs || []) {
          updateCameraConfig(item.camera_id, item.config);
        }

        for (const item of message.states || []) {
          updateCameraState(item.camera_id, item);
        }

        for (const frame of message.frames || []) {
          updateFrame(frame);
        }

        for (const event of message.events || []) {
          renderEvent(event);
        }
      }

      function sendJson(payload) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          return;
        }

        socket.send(JSON.stringify(payload));
      }

      function applyCameraConfig(cameraId) {
        const camera = ensureCamera(cameraId);
        const config = readConfigFromForm(camera);
        camera.config = config;
        renderCamera(camera);
        sendJson({
          type: "set_config",
          camera_id: cameraId,
          config
        });
      }

      function saveCameraName(cameraId) {
        const camera = ensureCamera(cameraId);
        sendJson({
          type: "set_display_name",
          camera_id: cameraId,
          display_name: camera.form.displayName.value
        });
      }

      function triggerRecording(cameraId) {
        sendJson({
          type: "trigger_recording",
          camera_id: cameraId
        });
      }

      function disconnectCamera(cameraId) {
        sendJson({
          type: "disconnect_camera",
          camera_id: cameraId
        });
      }

      function rotateCamera(cameraId) {
        const camera = ensureCamera(cameraId);
        camera.rotation = (camera.rotation + 90) % 360;
        renderCamera(camera);
      }

      function updateDigitalZoom(cameraId, value) {
        const camera = ensureCamera(cameraId);
        camera.digitalZoom = Math.min(4, Math.max(1, Number.parseFloat(value) || 1));
        camera.form.digitalZoom.value = camera.digitalZoom.toFixed(2).replace(/\.00$/, "");
        renderCamera(camera);
      }

      function toggleCameraControls(cameraId) {
        const camera = ensureCamera(cameraId);
        camera.controls.classList.toggle("is-collapsed");
        renderCamera(camera);
      }

      function connectViewer() {
        clearTimeout(reconnectTimer);
        socket = new WebSocket(websocketUrl());
        statusText.textContent = "Connecting...";

        socket.addEventListener("open", () => {
          statusText.textContent = "Connected";
          clearInterval(pingTimer);
          pingTimer = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: "ping", timestamp: new Date().toISOString() }));
            }
          }, 20000);
        });

        socket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);

          if (message.type === "snapshot") {
            applySnapshot(message);
          }

          if (message.type === "frame") {
            updateFrame(message);
          }

          if (message.type === "camera_status") {
            updateCameraStatus(message);
          }

          if (message.type === "camera_state") {
            updateCameraState(message.camera_id, message.state);
          }

          if (message.type === "camera_config") {
            updateCameraConfig(message.camera_id, message.config);
          }

          if (message.type === "detection_event" || message.type === "recording_failed") {
            renderEvent(message);
          }
        });

        socket.addEventListener("close", () => {
          clearInterval(pingTimer);
          statusText.textContent = "Disconnected. Reconnecting...";
          reconnectTimer = setTimeout(connectViewer, 2000);
        });

        socket.addEventListener("error", () => {
          statusText.textContent = "Connection error";
          socket.close();
        });
      }

      initializePoseDetector();
      connectViewer();
    </script>
  </body>
</html>
